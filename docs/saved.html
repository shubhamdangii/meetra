<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your plans · meetra</title>
<meta name="theme-color" content="#FFF7EC">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2316122B'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%23FFC93C' font-family='Arial' font-weight='900'>m</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap">
  <section class="page-hero">
    <span class="eyebrow">Your plans</span>
    <h1>Your little <span class="serif">calendar.</span></h1>
    <p>Seats you've requested and plans you've saved. Saved on this device only.</p>
  </section>
  <div class="group"><div class="group-head"><h3>Requested seats</h3><span id="rc"></span></div><div class="grid" id="reqs"></div></div>
  <div class="group"><div class="group-head"><h3>Saved for later ♥</h3><span id="sc"></span></div><div class="grid" id="saved"></div></div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const A = APP; A.header("saved"); A.footer(); A.title("Your plans");
const empty = (t, s) => `<div class="empty" style="grid-column:1/-1"><b>${t}</b>${s}<div style="margin-top:16px"><a class="btn btn-sun btn-sm" href="events.html">Find a plan →</a></div></div>`;
let dbRequests = null;   // when logged in: { planRef: status }
const LABEL = { pending: ["⏳ Pending", "#fff"], approved: ["🎉 You're in", "#C9F5E4"], waitlisted: ["🕒 Waiting list", "#FFE9A8"], declined: ["Not this time", "#FFE3EC"] };
function withStatus(e) {
  const st = dbRequests && dbRequests[e.id];
  const html = A.card(e);
  if (!st || !LABEL[st]) return html;
  return html.replace('<div class="card-body">', `<div class="card-body"><span class="tag" style="align-self:flex-start;background:${LABEL[st][1]};margin-bottom:4px">${LABEL[st][0]}</span>`);
}
function render() {
  let reqs = A.requests().map(r => A.byId(r.id)).filter(e => e && e.day >= 0);
  if (dbRequests) {
    const refs = Object.keys(dbRequests).filter(k => dbRequests[k] !== "cancelled");
    reqs = [...new Set([...refs, ...reqs.map(e => e.id)])].map(A.byId).filter(e => e && e.day >= 0 && dbRequests[e.id] !== "cancelled");
  }
  const saved = A.EVENTS.filter(e => A.isSaved(e.id));
  A.$("#rc").textContent = reqs.length ? `${reqs.length} upcoming` : "";
  A.$("#sc").textContent = saved.length ? `${saved.length} saved` : "";
  A.$("#reqs").innerHTML = reqs.map(withStatus).join("") || empty("No seat requests yet.", "Request a seat on any plan and it shows up here.");
  A.$("#saved").innerHTML = saved.map(A.card).join("") || empty("Nothing saved yet.", "Tap the ♡ on any plan to keep it here.");
  A.reveal();
}
document.addEventListener("savedchange", render);
render();
if (AUTH.enabled) AUTH.ready.then(async s => {
  if (!s.session || !s.me) return;
  A.$(".page-hero p").textContent = "Your seat requests with their status, and plans you've saved.";
  const { data } = await AUTH.client.from("plan_requests").select("plan_ref,status").eq("user_id", s.me.id);
  if (data) { dbRequests = Object.fromEntries(data.map(r => [r.plan_ref, r.status])); render(); }
});
</script>
</body>
</html>

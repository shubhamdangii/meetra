<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · meetra</title>
<meta name="description" content="Log in to meetra with Google or WhatsApp.">
<meta name="theme-color" content="#FFF7EC">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2316122B'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%23FFC93C' font-family='Arial' font-weight='900'>m</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="auth-wrap">
    <div class="auth-card">
      <div id="setupNote"></div>

      <!-- Step 1: choose -->
      <section id="stepChoose">
        <h1>Welcome to <span class="serif">meetra.</span></h1>
        <p>Log in to request seats. New here? The same buttons create your account.</p>

        <button class="provider" id="googleBtn" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continue with Google
        </button>

        <div class="or" id="orRow">or</div>

        <form id="waForm" novalidate>
          <div class="field">
            <label for="waPhone">WhatsApp number</label>
            <div class="phone-row"><span>+91</span><input id="waPhone" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="98765 43210" required></div>
          </div>
          <button class="provider wa" id="waBtn" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#06301A" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
            Send code on WhatsApp
          </button>
          <p class="form-msg" id="waMsg" role="status"></p>
        </form>
      </section>

      <!-- Step 2: OTP -->
      <section id="stepOtp" hidden>
        <h1>Check <span class="serif">WhatsApp.</span></h1>
        <p>We sent a 6-digit code to <b id="otpTo"></b>.</p>
        <form id="otpForm" novalidate>
          <div class="field"><label for="otp">Code</label>
            <input class="otp" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required></div>
          <button class="btn btn-sun btn-block" type="submit" id="otpBtn">Verify & log in →</button>
          <p class="form-msg" id="otpMsg" role="status"></p>
        </form>
        <p style="margin-top:14px;font-size:14px;display:flex;gap:16px;flex-wrap:wrap">
          <button class="linkish" id="resend" type="button">Resend code</button>
          <button class="linkish" id="changeNum" type="button">Use a different number</button>
        </p>
      </section>

      <p class="fine" style="margin-top:20px">By continuing you agree to our <a href="about.html#terms" style="text-decoration:underline">terms</a> and <a href="about.html#safety" style="text-decoration:underline">house rules</a>. We never post anything or message your contacts.</p>
    </div>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const A = APP; A.header(""); A.footer(); A.title("Log in");
const $ = A.$;
let phone = "", cooldown = 0, timer;

if (!CONFIG.loginWithGoogle) { $("#googleBtn").hidden = true; $("#orRow").hidden = true; }
// login.html#whatsapp-test shows WhatsApp login even while it's switched off for the public
// (for testing with the Twilio sandbox, which only delivers to the team's tester number).
const waTest = location.hash === "#whatsapp-test";
if (!CONFIG.loginWithWhatsApp && !waTest) { $("#waForm").hidden = true; $("#orRow").hidden = true; }
if (waTest && CONFIG.whatsappSandbox) {
  const s = CONFIG.whatsappSandbox;
  $("#setupNote").innerHTML = `<div class="setup-note"><b>WhatsApp test mode.</b> Codes only reach the tester number. First time (or after 72 hours), send <b>${s.join}</b> on WhatsApp to <a href="https://wa.me/${s.number.replace(/\D/g, "")}?text=${encodeURIComponent(s.join)}" target="_blank" rel="noopener" style="text-decoration:underline">${s.number}</a>.</div>`;
}

const msg = (el, text, kind = "err") => { el.textContent = text; el.className = "form-msg " + (text ? kind : ""); };

if (!AUTH.enabled) {
  $("#setupNote").innerHTML = `<div class="setup-note"><b>Login isn't switched on yet.</b> This is a preview. Add your Supabase URL and anon key in <code>assets/js/config.js</code> (see SETUP-LOGIN.md).</div>`;
  $("#googleBtn").disabled = true; $("#waBtn").disabled = true;
} else {
  // Coming back from Google: show the reason if the login didn't finish.
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  const errText = q.get("error_description") || h.get("error_description") || q.get("error") || h.get("error");
  const cameBack = q.has("code");
  // Already logged in? Go on.
  AUTH.ready.then(s => {
    if (s.session) return location.replace(AUTH.takeNext(s.me && s.me.profile_score >= 70 ? "events.html" : "profile.html"));
    if (errText || cameBack) {
      $("#setupNote").innerHTML = `<div class="setup-note"><b>Login didn't finish.</b> ${errText ? A.esc(errText.replace(/\+/g, " ")) : "Google sent you back, but this browser blocked the last step."}<br>
        Try again. If it keeps happening: turn off ad/tracker blocking for this site (in Brave: the lion icon → Shields off), or use Chrome or an incognito window.</div>`;
    }
  });
}

$("#googleBtn").onclick = async () => {
  if (!AUTH.enabled) return;
  $("#googleBtn").disabled = true;
  await AUTH.ready;
  const { error } = await AUTH.client.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: AUTH.redirectTo("login.html"), queryParams: { prompt: "select_account" } }
  });
  if (error) { $("#googleBtn").disabled = false; msg($("#waMsg"), "Google login didn't start: " + error.message); }
};

$("#waPhone").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10); });

async function sendCode() {
  const { error } = await AUTH.client.auth.signInWithOtp({ phone, options: { channel: "whatsapp" } });
  if (error) throw error;
  startCooldown();
}
function startCooldown() {
  cooldown = 30; clearInterval(timer);
  const b = $("#resend");
  const tick = () => { b.disabled = cooldown > 0; b.textContent = cooldown > 0 ? `Resend code in ${cooldown}s` : "Resend code"; cooldown--; if (cooldown < 0) clearInterval(timer); };
  tick(); timer = setInterval(tick, 1000);
}

$("#waForm").onsubmit = async e => {
  e.preventDefault();
  if (!AUTH.enabled) return;
  const n = $("#waPhone").value;
  if (!/^[6-9]\d{9}$/.test(n)) return msg($("#waMsg"), "Enter your 10-digit mobile number (starts with 6, 7, 8 or 9).");
  phone = "+91" + n;
  $("#waBtn").disabled = true; msg($("#waMsg"), "Sending code…", "ok");
  try {
    await AUTH.ready;
    await sendCode();
    $("#otpTo").textContent = `+91 ${n.slice(0, 5)} ${n.slice(5)}`;
    $("#stepChoose").hidden = true; $("#stepOtp").hidden = false; $("#otp").focus();
  } catch (err) {
    msg($("#waMsg"), "Couldn't send the code: " + err.message);
  } finally { $("#waBtn").disabled = false; }
};

$("#otp").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
  if (e.target.value.length === 6) $("#otpForm").requestSubmit();
});

$("#otpForm").onsubmit = async e => {
  e.preventDefault();
  const token = $("#otp").value;
  if (!/^\d{6}$/.test(token)) return msg($("#otpMsg"), "Enter the 6-digit code.");
  $("#otpBtn").disabled = true; msg($("#otpMsg"), "Checking…", "ok");
  const { error } = await AUTH.client.auth.verifyOtp({ phone, token, type: "sms" });
  $("#otpBtn").disabled = false;
  if (error) return msg($("#otpMsg"), /expired|invalid/i.test(error.message) ? "That code is wrong or expired. Try again or resend." : error.message);
  msg($("#otpMsg"), "Logged in ✓", "ok");
  await AUTH.refreshMe();
  location.replace(AUTH.takeNext(AUTH.me && AUTH.me.profile_score >= 70 ? "events.html" : "profile.html"));
};

$("#resend").onclick = async () => {
  try { await sendCode(); msg($("#otpMsg"), "New code sent.", "ok"); } catch (err) { msg($("#otpMsg"), err.message); }
};
$("#changeNum").onclick = () => { $("#stepOtp").hidden = true; $("#stepChoose").hidden = false; $("#otp").value = ""; msg($("#otpMsg"), ""); };
</script>
</body>
</html>

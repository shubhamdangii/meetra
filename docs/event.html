<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup · meetra</title>
<meta name="theme-color" content="#FFF7EC">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2316122B'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%23FFC93C' font-family='Arial' font-weight='900'>m</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap" id="page"></main>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const A = APP; A.header("events"); A.footer();
const id = A.hashVal() || new URLSearchParams(location.search).get("id") || "";
addEventListener("hashchange", () => { location.reload(); });
let e = A.byId(id);
// Old link to a past date? Jump to the next date of the same plan.
if (!e || e.day < 0) {
  const key = id.replace(/-\d{8}$/, "");
  const next = A.EVENTS.find(x => `${x.key}-${x.city}` === key);
  if (next) { const old = e; e = next; if (old) setTimeout(() => A.toast("That date has passed — showing the next one"), 400); }
}

if (!e) {
  A.title("Plan not found");
  A.$("#page").innerHTML = `<section class="page-hero"><h1>This plan has <span class="serif">wandered off.</span></h1><p>It may have finished or been renamed.</p><div style="margin-top:24px"><a class="btn btn-sun" href="events.html">See what's on →</a></div></section>`;
} else render();

function render() {
  const cat = A.catOf(e.cat), city = CONFIG.cities[e.city].name;
  const hosts = e.hosts.map(h => HOSTS[h]).filter(Boolean);
  const pct = Math.round((1 - e.left / e.seats) * 100);
  const sameKey = A.EVENTS.filter(x => x.key === e.key && x.city === e.city && x.id !== e.id).slice(0, 4);
  const others = A.EVENTS.filter(x => x.city === e.city && x.key !== e.key && x.day <= e.day + 7).filter((x, i, a) => a.findIndex(y => y.key === x.key) === i).slice(0, 4);
  const payNote = e.priceType === "reservation" ? "Food and drinks are ordered separately." : e.priceType === "per person" ? "Covers everything listed in the plan." : e.priceType === "estimate" ? "Final inclusions and price shared before you pay." : "Free — just show up on time.";
  A.title(`${e.title} · ${city} · ${e.date.getDate()} ${A.MON[e.date.getMonth()]}`);

  A.$("#page").innerHTML = `
  <nav class="crumbs"><a href="events.html">Explore</a> / <a href="events.html#${e.cat}">${cat.label}</a> / <span>${A.esc(city)}</span></nav>
  <div class="ev-head">
    <div>
      <h1>${A.esc(e.title)}</h1>
      <div class="meta"><span>${A.fmtDay(e.date)}</span>·<span>${e.time} – ${e.end}</span>·<span>${A.esc(e.area)}, ${city}</span>${e.tags.map(t => `<span class="tag">${A.esc(t)}</span>`).join("")}</div>
      <div class="meta" style="margin-top:8px"><span class="faces" style="display:inline-flex">${hosts.map(h => `<span style="background:${h.color};width:28px;height:28px;font-size:12px">${h.name[0]}</span>`).join("")}</span> hosted by <b>${A.esc(A.hostNames(e))}</b><span class="verified">✓</span></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-white btn-sm ${A.isSaved(e.id) ? "on" : ""}" data-save="${e.id}" data-label="1">${A.isSaved(e.id) ? "♥ Saved" : "♡ Save"}</button>
      <button class="btn btn-white btn-sm" id="share">↗ Share</button>
    </div>
  </div>

  <div class="ev-layout">
    <div>
      <div class="ev-hero">${A.poster(e, { title: true })}</div>
      <p class="lede">${A.esc(e.blurb)}</p>
      <div class="anchor-links"><a href="#unfolds">How it unfolds</a><a href="#host">Your host</a><a href="#before">Before you go</a></div>

      <section class="ev-sec" id="unfolds">
        <h2>How it <span class="serif" style="color:var(--violet)">unfolds</span></h2>
        <ol class="timeline">${e.steps.map((s, i) => `<li><b>${A.esc(s)}</b><span class="muted">${["Everyone arrives, gets a name tag and a drink.", "This is where the table really starts talking.", "Most people stay longer than planned."][i] || ""}</span></li>`).join("")}</ol>
      </section>

      <section class="ev-sec" id="host">
        <h2>Your <span class="serif" style="color:var(--violet)">host</span></h2>
        ${hosts.map(h => `<div class="host-row" style="margin-bottom:14px"><div class="av" style="background:${h.color}">${h.name[0]}</div><div><span class="eyebrow">${CONFIG.brand} host · verified</span><h3>${A.esc(h.name)} <span class="verified">✓</span></h3><p class="muted">${A.esc(h.bio)}</p></div></div>`).join("")}
      </section>

      <section class="ev-sec" id="before" style="border:0">
        <h2>Before <span class="serif" style="color:var(--violet)">you go</span></h2>
        <details class="acc" open><summary>Price & what it covers</summary><div class="acc-body"><b>${A.priceShort(e)} ${A.priceLabel(e)}.</b> ${payNote} ${e.priceType === "reservation" ? `The ${A.priceShort(e)} reservation is non-refundable once confirmed.` : ""}</div></details>
        <details class="acc"><summary>Where to meet</summary><div class="acc-body">${A.esc(e.area)}, ${city}. The exact spot is shared on WhatsApp after your seat is confirmed.</div></details>
        <details class="acc"><summary>Who can come</summary><div class="acc-body">${e.tags.includes("Women only") ? "This plan is for women only." : "Open to everyone 18+."} Most people come alone — that's the point.</div></details>
        <details class="acc"><summary>Cancellations</summary><div class="acc-body">If you can't make it, tell your host as early as you can so someone on the waitlist gets your seat. If we cancel, you get a full refund.</div></details>
        <details class="acc"><summary>Help at the meetup</summary><div class="acc-body">Your host is there from start to finish. You can also message us on WhatsApp any time.</div></details>
      </section>
    </div>

    <aside class="book" id="book">
      <div class="book-top"><div class="amt">${A.priceShort(e)}</div><small>${A.priceLabel(e)}${e.priceType === "reservation" ? " · pay after approval" : ""}</small></div>
      <div class="book-body">
        <ul class="facts">
          <li><span class="ic">📅</span><div><small>Date</small><b>${A.fmtDay(e.date)}</b></div></li>
          <li><span class="ic">⏰</span><div><small>Time</small><b>${e.time} – ${e.end}</b></div></li>
          <li><span class="ic">📍</span><div><small>Area</small><b>${A.esc(e.area)}, ${city}</b></div></li>
          <li><span class="ic">👥</span><div><small>Group</small><b>Up to ${e.seats} · ${e.tags.includes("Women only") ? "women only" : "open to all"}</b>
            <div class="meter"><i style="width:${pct}%"></i></div><small style="color:${e.left <= 4 ? "#B3134B" : "var(--muted)"}">${e.left === 0 ? "Full — join the waitlist" : `${e.left} of ${e.seats} seats left`}</small></div></li>
        </ul>
        <form id="req">
          <div class="field"><label for="nm">Your name</label><input id="nm" required autocomplete="given-name" placeholder="First name is fine"></div>
          <div class="field"><label for="ice">What could someone ask you about that makes you forget the small talk?</label><textarea id="ice" placeholder="Football, old Hindi songs, startups, cats…"></textarea></div>
          <label class="check"><input type="checkbox" id="friend"> I'm bringing a friend</label>
          <button class="btn btn-sun btn-block" type="submit">${e.left === 0 ? "Join the waitlist" : "Request a seat"} →</button>
          <p class="fine">Opens WhatsApp with your request. Your host confirms there, then you pay. Only your host sees your number.</p>
        </form>
      </div>
    </aside>
  </div>

  ${sameKey.length ? `<section class="sec" style="padding-bottom:0"><div class="group-head"><h3>More dates for ${A.esc(e.title.split(" · ")[0])}</h3></div><div class="grid">${sameKey.map(A.card).join("")}</div></section>` : ""}
  <section class="sec"><div class="group-head"><h3>More plans to try</h3><a class="btn btn-white btn-sm" href="events.html">Explore all →</a></div><div class="grid">${others.map(A.card).join("")}</div></section>

  <div class="mobile-book"><div><b>${A.priceShort(e)}</b> <small class="muted">${A.priceLabel(e)}</small><br><small class="muted">${A.fmtDay(e.date)} · ${e.time}</small></div><a class="btn btn-sun btn-sm" href="#book">Request a seat</a></div>`;

  // Logged-in members: pre-fill their name and tell them what's needed.
  if (AUTH.enabled) AUTH.ready.then(s => {
    if (s.me && s.me.display_name && s.me.display_name !== "New member") A.$("#nm").value = s.me.display_name;
    const note = !s.session ? "You'll be asked to log in with Google or WhatsApp first."
      : !(s.me && s.me.profile_complete) ? "You'll be asked to complete your profile first." : "";
    if (note) A.$("#req .fine").textContent = note + " Hosts only approve guests with a complete profile.";
  });

  A.$("#req").onsubmit = async ev => {
    ev.preventDefault();
    // Trust: only logged-in members with a complete profile can request a seat.
    if (!(await AUTH.requireCompleteProfile(location.href))) return;
    const name = A.$("#nm").value.trim(), ice = A.$("#ice").value.trim(), friend = A.$("#friend").checked;
    const verified = AUTH.enabled && AUTH.me ? `\nmeetra profile: complete ✓${AUTH.me.phone_verified ? " · WhatsApp verified ✓" : ""}` : "";
    const msg = `Hi! I'd like ${friend ? "2 seats" : "a seat"} at *${e.title}* on ${A.fmtDay(e.date)}, ${e.time} (${e.area}, ${city}).\n\nName: ${name}${ice ? `\nAsk me about: ${ice}` : ""}${verified}\n\nRef: ${e.id}`;
    A.addRequest({ id: e.id, name, friend, at: Date.now() });
    A.whatsappDone(A.$("#req"), msg, `Almost there, ${name}!`);
    A.toast("Saved to Your plans ✓");
  };
  A.$("#share").onclick = () => A.share({ title: e.title, text: `${e.title} · ${A.fmtDay(e.date)}, ${e.time}`, url: location.href });
  A.reveal();
}
</script>
</body>
</html>

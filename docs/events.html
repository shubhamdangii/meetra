<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore meetups · meetra</title>
<meta name="description" content="Every hosted meetup this month — filter by day, category and city.">
<meta name="theme-color" content="#FFF7EC">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2316122B'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%23FFC93C' font-family='Arial' font-weight='900'>m</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap">
  <section class="page-hero">
    <span class="eyebrow">Explore</span>
    <h1>Something on, <span class="serif">every day.</span></h1>
    <p id="sub"></p>
  </section>

  <div class="sec-head" style="margin-bottom:16px">
    <div class="toolbar">
      <label class="search"><span>🔍</span><input id="q" type="search" placeholder="Search plans, areas, hosts…" aria-label="Search"></label>
      <select class="select" id="when" aria-label="When">
        <option value="all">All dates</option><option value="today">Today</option><option value="tomorrow">Tomorrow</option>
        <option value="weekend">This weekend</option><option value="week">This week</option><option value="next">Next week</option><option value="later">Later</option>
      </select>
      <select class="select" id="price" aria-label="Price">
        <option value="all">Any price</option><option value="free">Free</option><option value="99">₹99 reservation</option><option value="500">Under ₹500</option>
      </select>
    </div>
    <button class="btn btn-white btn-sm" id="reset">Reset filters</button>
  </div>
  <div class="daystrip" id="days" aria-label="Pick a day"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div class="more-row" id="more"></div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const A = APP; A.header("events"); A.footer(); A.title("Explore meetups");
const P = new URLSearchParams(location.search);
const S = { q: P.get("q") || "", cat: P.get("cat") || "all", when: P.get("when") || "all", price: "all", date: P.get("date") || null };
// Links like events.html#weekend or events.html#food
const H = A.hashVal();
if (["today", "tomorrow", "weekend", "week", "next", "later"].includes(H)) S.when = H;
else if (CATEGORIES.some(c => c.id === H)) S.cat = H;
let shownDays = 7;
A.$("#q").value = S.q; A.$("#when").value = S.when;

const td = A.today.getDay(), satOff = (6 - td + 7) % 7, sunOff = td === 0 ? 0 : 7 - td;
const whenOk = e => ({ all: true, today: e.day === 0, tomorrow: e.day === 1, weekend: (e.day === satOff || e.day === sunOff) && e.day <= 6,
  week: e.day <= 6, next: e.day > 6 && e.day <= 13, later: e.day > 13 })[S.when];
const priceOk = e => S.price === "all" || (S.price === "free" ? e.priceType === "free" : S.price === "99" ? e.price <= 99 : e.price < 500);
const base = () => A.EVENTS.filter(e => A.inCity(e));
const filtered = () => base().filter(e => (S.cat === "all" || e.cat === S.cat) && whenOk(e) && priceOk(e)
  && (!S.date || A.fmtDay(e.date) === S.date)
  && (!S.q || (e.title + " " + e.area + " " + A.hostNames(e) + " " + e.cat).toLowerCase().includes(S.q.toLowerCase())));

function syncUrl() {
  const h = S.cat !== "all" ? S.cat : S.when !== "all" ? S.when : "";
  try { history.replaceState(null, "", h ? "#" + h : location.pathname); } catch {}
}

function renderDays() {
  const counts = {}; base().filter(e => S.cat === "all" || e.cat === S.cat).forEach(e => counts[A.fmtDay(e.date)] = (counts[A.fmtDay(e.date)] || 0) + 1);
  let h = "";
  for (let i = 0; i < 28; i++) {
    const d = A.addDays(A.today, i), k = A.fmtDay(d), n = counts[k] || 0;
    h += `<button class="day ${S.date === k ? "on" : ""} ${n ? "" : "none"}" data-d="${k}"><small>${i === 0 ? "TODAY" : A.DOW[d.getDay()].toUpperCase()}</small><b>${d.getDate()}</b><em>${n} plan${n === 1 ? "" : "s"}</em></button>`;
  }
  A.$("#days").innerHTML = h;
}
function renderChips() {
  const b = base();
  A.$("#chips").innerHTML = CATEGORIES.map(c => {
    const n = c.id === "all" ? b.length : b.filter(e => e.cat === c.id).length;
    return `<button class="pill ${S.cat === c.id ? "on" : ""}" data-c="${c.id}">${c.icon} ${c.label} <span class="muted" style="${S.cat === c.id ? "color:#BDB8D0" : ""}">${n}</span></button>`;
  }).join("");
}
function renderList() {
  const list = filtered();
  A.$("#sub").textContent = `${base().length} hosted plans in the next 4 weeks in ${A.cityName(A.getCity())}. Pick a day, pick a vibe.`;
  const byDay = new Map(); list.forEach(e => { const k = A.fmtDay(e.date); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); });
  const days = [...byDay.entries()];
  const lim = S.date ? days : days.slice(0, shownDays);
  A.$("#list").innerHTML = lim.map(([k, evs]) => `<div class="group"><div class="group-head"><h3>${A.relDay(evs[0].date)}${evs[0].day > 1 ? "" : ` <span class="serif muted" style="font-size:.8em">· ${k}</span>`}</h3><span>${evs.length} plan${evs.length === 1 ? "" : "s"}</span></div><div class="grid">${evs.map(A.card).join("")}</div></div>`).join("")
    || `<div class="empty"><b>No plans match those filters.</b>Try a different day or category — or <a href="host.html" style="text-decoration:underline">host this one yourself</a>.</div>`;
  A.$("#more").innerHTML = !S.date && days.length > shownDays ? `<button class="btn btn-sun" id="moreBtn">Show more days (${days.length - shownDays} left) ↓</button>` : "";
  A.reveal(A.$("#list"));
}
function renderAll() { renderDays(); renderChips(); renderList(); syncUrl(); }

A.$("#q").oninput = e => { S.q = e.target.value.trim(); renderList(); syncUrl(); };
A.$("#when").onchange = e => { S.when = e.target.value; S.date = null; shownDays = 28; renderAll(); };
A.$("#price").onchange = e => { S.price = e.target.value; renderList(); };
A.$("#chips").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; S.cat = b.dataset.c; renderAll(); };
A.$("#days").onclick = e => { const b = e.target.closest("[data-d]"); if (!b) return; S.date = S.date === b.dataset.d ? null : b.dataset.d; S.when = "all"; A.$("#when").value = "all"; renderAll(); };
A.$("#more").onclick = e => { if (e.target.id === "moreBtn") { shownDays += 7; renderList(); } };
A.$("#reset").onclick = () => { Object.assign(S, { q: "", cat: "all", when: "all", price: "all", date: null }); A.$("#q").value = ""; A.$("#when").value = "all"; A.$("#price").value = "all"; shownDays = 7; renderAll(); };
document.addEventListener("citychange", renderAll);
if (S.when !== "all") shownDays = 28;
renderAll();
</script>
</body>
</html>
